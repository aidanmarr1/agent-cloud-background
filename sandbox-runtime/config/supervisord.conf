[supervisord]
nodaemon=true
pidfile=/tmp/agent-supervisord.pid
logfile=/tmp/agent-supervisor/supervisord.log
childlogdir=/tmp/agent-supervisor

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1440x900x24 -nolisten tcp -ac
autostart=true
autorestart=true
startsecs=0
stopsignal=TERM
stdout_logfile=/tmp/agent-supervisor/xvfb.stdout.log
stderr_logfile=/tmp/agent-supervisor/xvfb.stderr.log
environment=HOME="/home/user",DISPLAY=":0"

